<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070b0d">
  <title>Ballfall — Rogue Plinko</title>
  <meta name="description" content="Roguelike de Plinko com 200 setores, crafting, XP e árvore de talentos.">
  <style>:root {
  --ink: #070b0d;
  --panel: #111719;
  --panel-2: #151d1f;
  --line: #2b3536;
  --paper: #e8e9db;
  --muted: #7d8987;
  --acid: #c9f35c;
  --orange: #ff7849;
  --violet: #9e76ff;
  --cyan: #65e4d1;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--ink); }
body {
  color: var(--paper);
  font-family: var(--font-geist-sans), Arial, sans-serif;
  background: radial-gradient(circle at 50% 0%, rgba(100, 228, 209, .08), transparent 32rem), repeating-linear-gradient(90deg, transparent 0 63px, rgba(255,255,255,.018) 64px), var(--ink);
}
button { font: inherit; }
.game-shell { min-height: 100vh; }
.topbar { height: 68px; padding: 0 28px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; border-bottom: 1px solid var(--line); background: rgba(7, 11, 13, .94); letter-spacing: .08em; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 18px; }
.brand-mark { width: 28px; height: 28px; display: grid; place-items: center; color: var(--ink); background: var(--acid); border-radius: 50%; box-shadow: inset 0 0 0 7px #151b19; }
.brand small { padding-left: 10px; color: var(--muted); border-left: 1px solid var(--line); font-size: 9px; }
.run-progress { display: flex; align-items: center; gap: 13px; font: 700 10px var(--font-geist-mono), monospace; color: var(--muted); }
.run-nodes { display: flex; gap: 5px; }
.run-nodes i { width: 32px; height: 4px; display: block; background: #202829; transform: skewX(-20deg); }
.run-nodes i.done { background: #647571; }
.run-nodes i.active { background: var(--acid); box-shadow: 0 0 12px rgba(201,243,92,.55); }
.wallet { justify-self: end; display: flex; align-items: center; gap: 8px; font: 700 11px var(--font-geist-mono), monospace; }
.wallet > span { padding: 9px 12px; border: 1px solid var(--line); background: #0d1214; }
.wallet b { color: var(--acid); }
.icon-button { width: 34px; height: 34px; border: 1px solid var(--line); color: var(--muted); background: transparent; cursor: pointer; }
.play-layout { max-width: 1380px; margin: 0 auto; padding: 22px 24px 32px; display: grid; grid-template-columns: minmax(680px, 1fr) 330px; gap: 18px; }
.board-panel, .side-panel > div { border: 1px solid var(--line); background: linear-gradient(145deg, rgba(21,29,31,.88), rgba(12,17,19,.94)); }
.board-panel { min-width: 0; overflow: hidden; }
.board-heading { height: 72px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
.board-heading p, .eyebrow, .section-title, .tip-card > span { margin: 0 0 4px; color: var(--muted); font: 700 9px var(--font-geist-mono), monospace; letter-spacing: .14em; }
.board-heading h1 { margin: 0; font-size: 20px; letter-spacing: -.04em; }
.objective { text-align: right; font: 700 9px var(--font-geist-mono), monospace; color: var(--muted); }
.objective strong { margin-top: 5px; display: block; color: var(--orange); letter-spacing: .08em; }
.plinko-board { height: min(59vh, 572px); min-height: 430px; position: relative; overflow: hidden; border-bottom: 1px solid var(--line); background: linear-gradient(rgba(255,255,255,.014) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.014) 1px, transparent 1px); background-size: 32px 32px; }
.board-glow { position: absolute; inset: 10% 20% 5%; border-radius: 50%; background: rgba(101,228,209,.06); filter: blur(35px); }
.launcher-track { position: absolute; z-index: 3; top: 16px; left: 20%; right: 20%; height: 48px; border-top: 1px dashed #425251; }
.aim-line { position: absolute; left: 52%; top: 0; width: 1px; height: 98px; border-left: 1px dashed rgba(201,243,92,.65); }
.loaded-ball { position: absolute; left: calc(52% - 15px); top: -15px; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; color: var(--ink); background: var(--acid); font: 900 10px var(--font-geist-mono), monospace; box-shadow: 0 0 20px rgba(201,243,92,.4), inset 4px -5px 0 rgba(0,0,0,.18); }
.pegs { position: absolute; top: 91px; left: 10%; right: 10%; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 56px; justify-items: center; }
.pegs i { width: 8px; height: 8px; border-radius: 50%; background: #899895; box-shadow: 0 0 0 5px rgba(127,147,143,.08); }
.pickup { position: absolute; z-index: 2; display: flex; align-items: center; gap: 5px; color: var(--acid); font: 700 10px var(--font-geist-mono), monospace; }
.pickup span { width: 25px; height: 25px; display: grid; place-items: center; border: 1px solid rgba(201,243,92,.5); background: rgba(201,243,92,.08); transform: rotate(45deg); }
.pickup-left { left: 21%; top: 39%; }
.pickup-right { right: 20%; top: 56%; color: var(--cyan); }
.enemy { position: absolute; z-index: 3; width: 58px; height: 58px; display: grid; place-items: center; border: 1px solid var(--orange); background: #241813; box-shadow: 0 0 0 5px rgba(255,120,73,.06), inset 0 0 20px rgba(255,120,73,.07); clip-path: polygon(25% 0, 75% 0, 100% 25%, 100% 75%, 75% 100%, 25% 100%, 0 75%, 0 25%); }
.enemy span { position: absolute; top: -12px; left: -2px; color: var(--orange); font: 700 8px var(--font-geist-mono), monospace; }
.enemy b { font: 900 17px var(--font-geist-mono), monospace; }
.enemy small { margin-top: -17px; color: var(--muted); font: 700 7px var(--font-geist-mono), monospace; }
.enemy-a { left: 33%; top: 28%; }.enemy-b { right: 29%; top: 38%; }.enemy-c { left: 46%; top: 62%; }
.damage-zones { position: absolute; inset: auto 0 0; height: 53px; padding: 0 5%; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; gap: 5px; }
.damage-zones span { height: 38px; display: grid; place-items: center; border-top: 2px solid var(--cyan); background: linear-gradient(rgba(101,228,209,.14), transparent); color: var(--cyan); font: 900 11px var(--font-geist-mono), monospace; }
.damage-zones .zone-hot { border-color: var(--acid); color: var(--acid); background: linear-gradient(rgba(201,243,92,.18), transparent); }
.damage-zones .zone-bad { border-color: var(--orange); color: var(--orange); background: linear-gradient(rgba(255,120,73,.15), transparent); }
.launch-row { min-height: 76px; padding: 12px 18px; display: grid; grid-template-columns: 1fr 240px 1fr; align-items: center; gap: 18px; background: #0b1012; }
.ball-rack { display: flex; align-items: center; gap: 7px; }
.ball-rack small { max-width: 55px; margin-left: 5px; color: var(--muted); font: 700 8px/1.25 var(--font-geist-mono), monospace; letter-spacing: .08em; }
.ball { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; color: #07100d; font: 900 9px var(--font-geist-mono), monospace; box-shadow: inset 4px -5px 0 rgba(0,0,0,.2); }
.ball.steel { background: var(--paper); }.ball.spark { background: var(--violet); }.ball.ember { background: var(--orange); }
.drop-button { height: 50px; display: flex; align-items: center; justify-content: center; gap: 22px; border: 0; color: #111809; background: var(--acid); font-weight: 950; letter-spacing: .04em; cursor: pointer; box-shadow: 0 5px 0 #6c812e, 0 0 25px rgba(201,243,92,.13); transition: transform .15s ease; }
.drop-button:hover { transform: translateY(-2px); }
.drop-button small { padding: 4px 6px; border: 1px solid rgba(0,0,0,.2); font: 700 7px var(--font-geist-mono), monospace; }
.odds { justify-self: end; text-align: right; font: 700 8px var(--font-geist-mono), monospace; color: var(--muted); }.odds strong { margin-top: 3px; display: block; color: var(--paper); font-size: 14px; }
.side-panel { display: flex; flex-direction: column; gap: 12px; }
.side-panel > div { padding: 16px; }
.eyebrow, .section-title { display: flex; justify-content: space-between; }.eyebrow b { color: var(--orange); }
.boss-visual { height: 84px; display: grid; place-items: center; margin: 12px 0; overflow: hidden; background: repeating-linear-gradient(135deg, rgba(255,120,73,.025) 0 6px, rgba(255,120,73,.07) 6px 7px); }
.boss-visual span { width: 70px; height: 70px; display: grid; place-items: center; border: 1px solid var(--orange); border-radius: 42% 42% 20% 20%; color: var(--orange); font-size: 38px; box-shadow: inset 0 -16px 0 rgba(255,120,73,.08), 0 0 26px rgba(255,120,73,.12); }
.enemy-card h2 { margin: 0; font-size: 17px; }.enemy-card > p { min-height: 34px; margin: 6px 0 14px; color: #929c99; font-size: 11px; line-height: 1.45; }
.health { height: 6px; padding: 1px; border: 1px solid #673325; }.health span { height: 100%; display: block; background: var(--orange); box-shadow: 0 0 9px rgba(255,120,73,.45); }
.health-label { margin-top: 6px; display: flex; justify-content: space-between; color: var(--muted); font: 700 8px var(--font-geist-mono), monospace; }.health-label b { color: var(--paper); }
.section-title { margin-bottom: 12px; }.section-title b { color: var(--paper); }
.module-list { display: flex; flex-direction: column; gap: 7px; }
.module { padding: 9px; display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 9px; border: 1px solid var(--line); background: #0e1416; }
.module-icon { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid currentColor; background: rgba(255,255,255,.03); }
.module h3 { margin: 0; color: var(--paper); font: 800 10px var(--font-geist-mono), monospace; }.module p { margin: 3px 0 0; color: var(--muted); font-size: 9px; }.module > b { color: var(--muted); font: 700 9px var(--font-geist-mono), monospace; }
.module.lime { color: var(--acid); }.module.violet { color: var(--violet); }.module.orange { color: var(--orange); }
.tip-card { border-left: 2px solid var(--acid) !important; background: rgba(201,243,92,.045) !important; }.tip-card > span { color: var(--acid); }.tip-card p { margin: 7px 0 0; color: #a2aba8; font-size: 10px; line-height: 1.5; }.tip-card b { color: var(--paper); }
@media (max-width: 980px) { .play-layout { grid-template-columns: 1fr; }.side-panel { display: grid; grid-template-columns: 1fr 1fr; }.tip-card { grid-column: 1 / -1; }.topbar { grid-template-columns: 1fr 1fr; }.run-progress { display: none; } }
@media (max-width: 680px) { .topbar { height: 58px; padding: 0 13px; }.brand small, .wallet > span:nth-child(2) { display: none; }.play-layout { padding: 10px; }.board-heading { padding: 0 13px; }.objective { display: none; }.plinko-board { height: 56vh; min-height: 430px; }.pegs { left: 2%; right: 2%; }.launch-row { grid-template-columns: 1fr; gap: 10px; }.drop-button { grid-row: 1; width: 100%; }.odds { display: none; }.ball-rack { justify-content: center; }.side-panel { grid-template-columns: 1fr; }.tip-card { grid-column: auto; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }

/* Interactive game layer */
.score-block { text-align: center; font: 700 8px var(--font-geist-mono), monospace; color: var(--muted); }
.score-block strong { display: block; color: var(--paper); font-size: 18px; letter-spacing: .08em; }
.score-block small { display: block; margin-top: 2px; font-size: 7px; }
.launcher-track { left: 0; right: 0; margin: 0; border-top-color: transparent; }
.launcher-track::before { content: ''; position: absolute; left: 5%; right: 5%; top: -1px; height: 1px; border-top: 1px dashed #425251; background: linear-gradient(90deg, transparent, #43514f 15%, #43514f 85%, transparent); }
.loaded-ball.spark { background: var(--violet); }
.loaded-ball.ember { background: var(--orange); }
.loaded-ball.steel { background: var(--paper); }
.pegs { position: absolute; inset: 0; display: block; }
.pegs i { position: absolute; transform: translate(-50%, -50%) !important; }
.pickup { transform: translate(-50%, -50%); pointer-events: none; }
.pickup.score { color: var(--cyan); }
.pickup.score span { border-color: rgba(101,228,209,.55); background: rgba(101,228,209,.08); }
.enemy { transform: translate(-50%, -50%); transition: opacity .2s ease, filter .2s ease; }
.enemy > i { position: absolute; left: 10px; bottom: 7px; height: 2px; max-width: 38px; background: var(--orange); }
.enemy.destroyed { opacity: .16; filter: grayscale(1); }
.enemy.destroyed::after { content: '×'; position: absolute; font-size: 34px; color: var(--orange); }
.plinko-board.stage-medium .board-glow { background: rgba(101,228,209,.075); }
.plinko-board.stage-hard .board-glow { background: rgba(158,118,255,.075); }
.plinko-board.stage-hard-plus .board-glow { background: rgba(255,120,73,.075); }
.plinko-board.stage-hard-plus-plus .board-glow { background: rgba(255,120,73,.1); }
.plinko-board.stage-nightmare .board-glow { background: rgba(158,118,255,.12); filter: blur(48px); }
.difficulty-hard-plus .run-nodes i.active, .difficulty-hard-plus-plus .run-nodes i.active { background: var(--orange); box-shadow: 0 0 12px rgba(255,120,73,.55); }
.difficulty-nightmare .run-nodes i.active { background: var(--violet); box-shadow: 0 0 14px rgba(158,118,255,.65); }
.live-ball { position: absolute; z-index: 8; left: 0; top: 0; border-radius: 50%; pointer-events: none; will-change: transform; box-shadow: 0 0 15px currentColor, inset 3px -4px 0 rgba(0,0,0,.22); }
.live-ball.steel { color: var(--paper); background: var(--paper); }
.live-ball.spark { color: var(--violet); background: var(--violet); }
.live-ball.ember { color: var(--orange); background: var(--orange); }
.live-ball span { position: absolute; inset: 25% 55% 55% 25%; border-radius: 50%; background: rgba(255,255,255,.7); }
.hit-fx { position: absolute; z-index: 12; pointer-events: none; transform: translate(-50%, -50%); font: 900 12px var(--font-geist-mono), monospace; animation: hit-pop .78s ease-out forwards; text-shadow: 0 2px 8px var(--ink); }
.hit-fx.damage { color: var(--orange); }.hit-fx.resource { color: var(--acid); }.hit-fx.score { color: var(--cyan); }.hit-fx.spark { color: var(--violet); }
@keyframes hit-pop { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -120%) scale(.9); } }
.pause-screen { position: absolute; z-index: 30; inset: 0; display: grid; place-content: center; text-align: center; background: rgba(6,10,11,.76); backdrop-filter: blur(4px); }
.pause-screen b { font-size: 28px; letter-spacing: .08em; }.pause-screen span { margin-top: 8px; color: var(--muted); font: 700 9px var(--font-geist-mono), monospace; }

.launch-row { grid-template-columns: minmax(330px, 1.4fr) 210px minmax(80px, .4fr); }
.ball-rack { align-items: stretch; }
.ball-choice { min-width: 90px; padding: 4px 7px; display: flex; align-items: center; gap: 7px; border: 1px solid transparent; color: var(--paper); background: transparent; text-align: left; cursor: pointer; }
.ball-choice:hover:not(:disabled), .ball-choice.selected { border-color: #465251; background: #151c1d; }
.ball-choice.selected { box-shadow: inset 0 -2px 0 var(--acid); }
.ball-choice:disabled { opacity: .34; cursor: not-allowed; }
.ball-choice i { font: 800 8px var(--font-geist-mono), monospace; font-style: normal; }
.ball-choice i small { width: 62px; margin: 3px 0 0; display: block; color: var(--muted); font-size: 6px; line-height: 1.2; }
.drop-button:disabled { cursor: not-allowed; filter: grayscale(.8) brightness(.55); transform: none; }
.empty-build { margin: 0; padding: 14px; border: 1px dashed var(--line); color: var(--muted); font-size: 10px; line-height: 1.5; }

.modal-backdrop { position: fixed; z-index: 100; inset: 0; padding: 22px; display: grid; place-items: center; background: rgba(3,6,7,.84); backdrop-filter: blur(8px); }
.modal-card { width: min(760px, 100%); padding: 30px; border: 1px solid #3a4644; background: linear-gradient(145deg, #151d1f, #0b1012); box-shadow: 0 30px 100px #000; text-align: center; }
.modal-kicker { margin: 0 0 7px !important; color: var(--acid) !important; font: 800 9px var(--font-geist-mono), monospace; letter-spacing: .18em; }
.modal-kicker.danger { color: var(--orange) !important; }
.modal-card > h2 { margin: 0; font-size: clamp(24px, 4vw, 38px); letter-spacing: -.04em; }
.modal-card > p { margin: 9px auto 24px; color: var(--muted); font-size: 12px; }
.reward-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.reward-option { min-height: 210px; padding: 17px; display: flex; flex-direction: column; align-items: flex-start; border: 1px solid var(--line); color: var(--paper); background: #0c1213; text-align: left; cursor: pointer; transition: transform .16s ease, border-color .16s ease, background .16s ease; }
.reward-option:hover { transform: translateY(-5px); border-color: currentColor; background: #141d1e; }
.reward-option > span { width: 48px; height: 48px; margin-bottom: 20px; display: grid; place-items: center; border: 1px solid currentColor; font-size: 21px; }
.reward-option small { color: var(--muted); font: 700 7px var(--font-geist-mono), monospace; }
.reward-option b { margin-top: 5px; font: 900 12px var(--font-geist-mono), monospace; }.reward-option p { min-height: 32px; margin: 8px 0 18px; color: #8d9996; font-size: 10px; line-height: 1.45; }.reward-option i { margin-top: auto; font: 800 8px var(--font-geist-mono), monospace; font-style: normal; }
.reward-option.lime { color: var(--acid); }.reward-option.violet { color: var(--violet); }.reward-option.orange { color: var(--orange); }
.restart-button { min-width: 240px; height: 52px; border: 0; color: #0b110a; background: var(--acid); font-weight: 900; cursor: pointer; box-shadow: 0 5px 0 #667b2c; }

@media (max-width: 1100px) {
  .launch-row { grid-template-columns: 1fr 190px; }
  .odds { display: none; }
}
@media (max-width: 680px) {
  .score-block { margin-left: auto; }.score-block small { display: none; }
  .launch-row { grid-template-columns: 1fr; }
  .ball-rack { overflow-x: auto; justify-content: flex-start; padding-bottom: 3px; }
  .ball-choice { flex: 0 0 92px; }
  .reward-grid { grid-template-columns: 1fr; max-height: 55vh; overflow-y: auto; }
  .reward-option { min-height: 135px; }.reward-option > span { margin-bottom: 10px; }.reward-option p { min-height: 0; }
  .modal-card { padding: 22px 14px; }
}

/* Workshop, XP and constellation talent tree */
.wallet .level-wallet b { color: var(--cyan); font-size: 8px; }
.hit-fx.gem { color: var(--violet); }
.hit-fx.xp { color: var(--cyan); }
.hit-fx.critical { color: #fff2a5; font-size: 13px; }
.xp-meter { height: 7px; margin-top: 7px; padding: 1px; border: 1px solid #294946; background: #0b1112; }
.xp-meter span { height: 100%; display: block; background: linear-gradient(90deg, #459f93, var(--cyan)); box-shadow: 0 0 9px rgba(101,228,209,.35); transition: width .3s ease; }
.xp-label { margin: 6px 0 13px; display: flex; justify-content: space-between; color: var(--muted); font: 700 7px var(--font-geist-mono), monospace; }
.xp-label b { color: var(--cyan); }
.module.cyan { color: var(--cyan); }
.talent-list { max-height: 154px; overflow: hidden; }

.modal-card.wide { width: min(920px, 100%); }
.workshop-resources { margin: -6px 0 16px; display: flex; justify-content: center; gap: 6px; }
.workshop-resources > span { min-width: 110px; padding: 9px 14px; display: flex; align-items: center; justify-content: space-between; gap: 14px; border: 1px solid var(--line); background: #0b1112; }
.workshop-resources b { color: var(--acid); font: 900 12px var(--font-geist-mono), monospace; }
.workshop-resources span:nth-child(2) b { color: var(--violet); }
.workshop-resources span:nth-child(3) b { color: var(--cyan); }
.workshop-resources small { color: var(--muted); font: 700 7px var(--font-geist-mono), monospace; }
.craft-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.craft-card { min-height: 245px; padding: 18px; display: flex; flex-direction: column; align-items: flex-start; border: 1px solid var(--line); background: radial-gradient(circle at 50% 18%, rgba(255,255,255,.045), transparent 36%), #0b1112; text-align: left; }
.craft-card.steel { color: var(--paper); }.craft-card.spark { color: var(--violet); }.craft-card.ember { color: var(--orange); }
.craft-ball { width: 52px; height: 52px; margin: 0 auto 18px; flex: 0 0 auto; font-size: 12px; box-shadow: inset 7px -8px 0 rgba(0,0,0,.2), 0 0 28px currentColor; }
.craft-card > small { color: var(--muted); font: 700 7px var(--font-geist-mono), monospace; letter-spacing: .1em; }
.craft-card h3 { margin: 5px 0 0; color: currentColor; font: 900 15px var(--font-geist-mono), monospace; }
.craft-card p { margin: 5px 0 12px; color: var(--muted); font-size: 10px; }
.recipe-cost { margin-top: auto; display: flex; gap: 6px; }
.recipe-cost span { min-width: 48px; padding: 6px; border: 1px solid #35413f; color: var(--acid); background: #101718; font: 800 9px var(--font-geist-mono), monospace; }
.recipe-cost span:nth-child(2) { color: var(--violet); }
.recipe-cost span.missing { color: #6f4b43; border-color: #4b302b; }
.craft-card > button { width: 100%; height: 34px; margin-top: 10px; border: 1px solid currentColor; color: currentColor; background: transparent; font: 900 8px var(--font-geist-mono), monospace; cursor: pointer; }
.craft-card > button:hover:not(:disabled) { color: var(--ink); background: currentColor; }
.craft-card > button:disabled { opacity: .3; cursor: not-allowed; }
.emergency-button { margin: 12px auto 0; padding: 9px 14px; border: 1px dashed var(--orange); color: var(--orange); background: transparent; font: 800 8px var(--font-geist-mono), monospace; cursor: pointer; }
.refill-notice { margin-top: 12px; padding: 10px 13px; display: flex; align-items: center; justify-content: center; gap: 11px; border: 1px solid rgba(101,228,209,.3); color: var(--cyan); background: rgba(101,228,209,.045); text-align: left; }
.refill-notice > span { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid currentColor; border-radius: 50%; font-size: 17px; }
.refill-notice b { display: block; font: 900 8px var(--font-geist-mono), monospace; letter-spacing: .08em; }.refill-notice small { display: block; margin-top: 3px; color: #8e9c98; font-size: 8px; }
.modal-actions { margin-top: 17px; padding-top: 14px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); }
.modal-actions span { color: var(--muted); font: 700 8px var(--font-geist-mono), monospace; }
.modal-actions button { min-width: 230px; height: 42px; border: 0; color: #111809; background: var(--acid); font: 900 9px var(--font-geist-mono), monospace; cursor: pointer; box-shadow: 0 4px 0 #667b2c; }
.modal-actions button:disabled { opacity: .3; cursor: not-allowed; }

.talent-toolbar { margin: -7px auto 10px; display: flex; justify-content: center; gap: 6px; }
.talent-toolbar span { padding: 7px 10px; border: 1px solid var(--line); color: var(--muted); background: #0a1011; font: 700 8px var(--font-geist-mono), monospace; }
.talent-toolbar b { color: var(--acid); font-size: 13px; }
.talent-tree { position: relative; height: 440px; overflow: hidden; border: 1px solid var(--line); background: radial-gradient(circle at 50% 82%, rgba(101,228,209,.09), transparent 20%), radial-gradient(circle at 50% 35%, rgba(158,118,255,.055), transparent 45%), linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px), #080d0e; background-size: auto, auto, 28px 28px, 28px 28px, auto; }
.talent-tree::before { content: ''; position: absolute; inset: 7%; border: 1px solid rgba(101,228,209,.06); border-radius: 50%; }
.talent-root { position: absolute; z-index: 3; left: 50%; top: 84%; width: 76px; height: 60px; display: grid; place-content: center; transform: translate(-50%, -50%); border: 1px solid var(--cyan); border-radius: 50%; color: var(--cyan); background: #0c1918; box-shadow: 0 0 28px rgba(101,228,209,.18); }
.talent-root b { font-size: 18px; }.talent-root small { display: block; color: var(--muted); font: 700 6px var(--font-geist-mono), monospace; }
.talent-links { position: absolute; z-index: 1; inset: 0; pointer-events: none; }
.talent-links i { position: absolute; display: block; height: 1px; background: linear-gradient(90deg, rgba(101,228,209,.65), rgba(158,118,255,.18)); transform-origin: left center; }
.link-impact { left: 50%; top: 81%; width: 25%; transform: rotate(-139deg); }
.link-fortune { left: 50%; top: 81%; width: 25%; transform: rotate(-41deg); }
.link-reservoir { left: 50%; top: 81%; width: 33%; transform: rotate(-90deg); }
.link-ember { left: 32%; top: 64%; width: 30%; transform: rotate(-117deg); }
.link-critical { left: 32%; top: 64%; width: 46%; transform: rotate(-91deg); }
.link-gemcraft { left: 68%; top: 64%; width: 30%; transform: rotate(-63deg); }
.link-magnet { left: 68%; top: 64%; width: 46%; transform: rotate(-89deg); }
.link-storm { left: 50%; top: 45%; width: 32%; transform: rotate(-90deg); }
.talent-node { position: absolute; z-index: 4; width: 102px; min-height: 68px; padding: 8px 6px; display: grid; grid-template-columns: 25px 1fr; grid-template-rows: auto auto; align-items: center; gap: 2px 6px; transform: translate(-50%, -50%); border: 1px solid #34403e; color: #66706e; background: #0b1112; text-align: left; }
.talent-node > span { grid-row: 1 / 3; width: 25px; height: 25px; display: grid; place-items: center; border: 1px solid currentColor; }
.talent-node > b { font: 900 8px var(--font-geist-mono), monospace; }.talent-node > small { color: #66716e; font-size: 6px; line-height: 1.25; }
.talent-node.available { cursor: pointer; animation: talent-pulse 1.8s ease-in-out infinite; }

@media (max-width: 760px) {

.menu-logo { height: 86px; margin-bottom: 12px; position: relative; display: flex; justify-content: center; align-items: flex-start; }

.menu-features b { color: var(--acid); font-size: 16px; }

.talent-root { top: 84%; width: 104px; height: 72px; grid-template-columns: 24px auto; grid-template-rows: auto auto; gap: 0 8px; border: 1px solid var(--cyan); border-radius: 20px; text-align: left; background: linear-gradient(145deg, #102220, #091313); box-shadow: 0 0 0 5px rgba(101,228,209,.045), 0 0 35px rgba(101,228,209,.2), inset 0 0 20px rgba(101,228,209,.06); }
.talent-root b { grid-row: 1 / 3; width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid var(--cyan); border-radius: 50%; color: var(--cyan); font-size: 11px; box-shadow: 0 0 13px rgba(101,228,209,.35); }
.talent-root span { color: var(--paper); font: 900 9px var(--font-geist-mono), monospace; }.talent-root small { color: var(--cyan); font-size: 6px; letter-spacing: .08em; }
.talent-links i { height: 2px; background: linear-gradient(90deg, rgba(101,228,209,.78), rgba(101,228,209,.2)); box-shadow: 0 0 9px rgba(101,228,209,.22); opacity: .85; }
.link-ember, .link-critical { background: linear-gradient(90deg, rgba(255,120,73,.62), rgba(255,120,73,.12)) !important; }.link-gemcraft, .link-magnet { background: linear-gradient(90deg, rgba(201,243,92,.58), rgba(201,243,92,.1)) !important; }.link-storm { background: linear-gradient(90deg, rgba(158,118,255,.62), rgba(158,118,255,.1)) !important; }
.talent-node { width: 140px; min-height: 92px; padding: 12px; grid-template-columns: 36px 1fr; grid-template-rows: auto auto auto; align-content: center; gap: 4px 10px; border-color: #45534f; color: #83908d; background: linear-gradient(145deg, rgba(18,27,28,.98), rgba(8,14,15,.98)); box-shadow: 0 8px 22px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.025); transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease, filter .16s ease; }
